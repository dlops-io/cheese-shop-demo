<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Cheese Shop architecture</title>
  <desc>The browser loads the page from frontend-react, which forwards /api to api-service. The API saves tickets in a Redis hash and adds their ids to a Redis list. The worker takes the next id from the list, ages the cheese, and updates the ticket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .sub { font-size: 13px; fill: #6b7280; }
      .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .label { font-size: 13px; fill: #374151; }
      .group { font-size: 13px; font-weight: 700; }
      .node { fill: #ffffff; stroke: #d6dbe1; stroke-width: 1.2; }
      .line { fill: none; stroke: #4b5563; stroke-width: 1.8; }
    </style>
  </defs>

  <!-- The card, so the picture reads the same on a light or a dark page -->
  <rect x="1" y="1" width="998" height="558" rx="18" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Docker network -->
  <rect x="262" y="30" width="708" height="500" rx="16" fill="#f3f8fd" stroke="#9fc3e6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="284" y="56" class="group" fill="#1d70b8">Docker network · cheese-shop-demo-network</text>

  <!-- Redis, with the two things it keeps -->
  <rect x="600" y="212" width="240" height="292" rx="14" fill="#fdf1f0" stroke="#efb8b2" stroke-width="1.5"/>
  <text x="618" y="236" class="group" fill="#c0392b">redis</text>

  <!-- Arrows, drawn first so the boxes sit on top -->
  <path class="line" d="M215 125 H298" marker-end="url(#arrow)"/>
  <text x="238" y="114" class="label" text-anchor="middle">:5810</text>

  <path class="line" d="M500 125 H618" marker-end="url(#arrow)"/>
  <text x="559" y="114" class="label" text-anchor="middle">/api → :9000</text>

  <path class="line" d="M720 160 V248" marker-end="url(#arrow)"/>
  <text x="732" y="198" class="label">saves tickets</text>

  <path class="line" d="M820 125 H890 V445 H822" marker-end="url(#arrow)"/>
  <text x="898" y="300" class="label">adds ids</text>

  <path class="line" d="M620 445 H502" marker-end="url(#arrow)"/>
  <text x="560" y="434" class="label" text-anchor="middle">next id</text>

  <path class="line" d="M400 410 V285 H618" marker-end="url(#arrow)"/>
  <text x="508" y="274" class="label" text-anchor="middle">aging, then ready</text>

  <!-- The browser -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="185" height="110" rx="12" class="node"/>
  </g>
  <path d="M30 96 H215" stroke="#e5e7eb"/>
  <circle cx="46" cy="83" r="4" fill="#ee6a5c"/>
  <circle cx="59" cy="83" r="4" fill="#f0b43f"/>
  <circle cx="72" cy="83" r="4" fill="#58d08a"/>
  <rect x="86" y="76" width="118" height="14" rx="7" fill="#f3f4f6"/>
  <text x="96" y="87" font-size="10" fill="#6b7280">localhost:5810</text>
  <g transform="translate(42 118) scale(0.62)">
    <path d="M6 46 L58 46 L36 10 Z" fill="#f6c445" stroke="#d99a1c" stroke-width="3"/>
    <circle cx="28" cy="36" r="5" fill="#8f5f0a" opacity=".55"/>
    <circle cx="43" cy="39" r="3.5" fill="#8f5f0a" opacity=".55"/>
    <circle cx="35" cy="26" r="3" fill="#8f5f0a" opacity=".55"/>
  </g>
  <text x="90" y="136" class="title">Cheese Shop</text>
  <text x="90" y="155" class="sub">React runs here</text>

  <!-- frontend-react -->
  <g filter="url(#shadow)">
    <rect x="300" y="90" width="200" height="70" rx="12" class="node"/>
  </g>
  <circle cx="330" cy="125" r="17" fill="#3b82f6"/>
  <text x="330" y="129.5" class="badge" text-anchor="middle">UI</text>
  <text x="358" y="121" class="title">frontend-react</text>
  <text x="358" y="140" class="sub">Vite · the page</text>

  <!-- api-service -->
  <g filter="url(#shadow)">
    <rect x="620" y="90" width="200" height="70" rx="12" class="node"/>
  </g>
  <circle cx="650" cy="125" r="17" fill="#10a37f"/>
  <text x="650" y="129.5" class="badge" text-anchor="middle">API</text>
  <text x="678" y="121" class="title">api-service</text>
  <text x="678" y="140" class="sub">FastAPI · :9810</text>

  <!-- tickets -->
  <g filter="url(#shadow)">
    <rect x="620" y="250" width="200" height="70" rx="12" class="node"/>
  </g>
  <circle cx="650" cy="285" r="17" fill="#dc382d"/>
  <text x="650" y="290" class="badge" text-anchor="middle" font-size="15">#</text>
  <text x="678" y="281" class="title">tickets</text>
  <text x="678" y="300" class="sub">a hash: id → ticket</text>

  <!-- queue -->
  <g filter="url(#shadow)">
    <rect x="620" y="410" width="200" height="70" rx="12" class="node"/>
  </g>
  <circle cx="650" cy="445" r="17" fill="#dc382d"/>
  <text x="650" y="450" class="badge" text-anchor="middle" font-size="15">≡</text>
  <text x="678" y="441" class="title">queue</text>
  <text x="678" y="460" class="sub">a list of ids waiting</text>

  <!-- worker -->
  <g filter="url(#shadow)">
    <rect x="300" y="410" width="200" height="70" rx="12" class="node"/>
  </g>
  <circle cx="330" cy="445" r="17" fill="#0f9d8a"/>
  <text x="330" y="449.5" class="badge" text-anchor="middle">W</text>
  <text x="358" y="441" class="title">worker</text>
  <text x="358" y="460" class="sub">one cheese at a time</text>
</svg>
