[project]
name = "cheese-shop-api"
version = "0.1.0"
description = "Cheese Shop API: order cheeses, and workers age them one at a time"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

# An application, not a library: install the dependencies only, never build a wheel of this project.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep pytest's cache off the bind mount in container development.
cache_dir = "${HOME}/.cache/cheese-shop-api/pytest"

[tool.ruff]
line-length = 110
target-version = "py313"
