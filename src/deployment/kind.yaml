# A three-node cluster, where each node is a Docker container on the laptop.
# Kubernetes 1.36, not kind's default 1.37: KEDA 2.21 supports up to 1.36.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      # http://localhost:8080 on the laptop reaches the frontend's NodePort
      - containerPort: 30080
        hostPort: 8080
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
