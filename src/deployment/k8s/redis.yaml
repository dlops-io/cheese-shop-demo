# The shop lives here, outside the API. No persistence: a shop that empties when Redis restarts is
# fine for a tutorial, and it keeps the StatefulSet and volume conversation for an app that needs one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          args: ["--save", ""]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis # the name the API and the workers call
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
