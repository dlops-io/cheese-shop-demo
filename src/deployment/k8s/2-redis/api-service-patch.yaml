# The one change to the API's Deployment: run the Redis version of the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  template:
    spec:
      containers:
        - name: api-service
          command: ["uvicorn", "api.service_redis:app", "--host", "0.0.0.0", "--port", "9000"]
