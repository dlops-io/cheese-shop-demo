# The page as static files behind nginx, which also passes /api to the api-service Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react
spec:
  selector:
    matchLabels: { app: frontend-react }
  template:
    metadata:
      labels: { app: frontend-react }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend-react
          image: cheese-shop-demo-frontend-react:v1
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
---
# NodePort opens the same port on every node; kind.yaml maps it to localhost:8080. In the cloud
# this job goes to a load balancer (cheese-app-v3).
apiVersion: v1
kind: Service
metadata:
  name: frontend-react
spec:
  type: NodePort
  selector: { app: frontend-react }
  ports: [{ name: http, port: 80, targetPort: http, nodePort: 30080 }]
